<!doctype html>
<html lang="en">

<head>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    FitBuddy — Error
  </title>

  <link

    href="/static/style.css"

<body>

  <main class="shell">

    <section class="card error-card">

        {{ message }}

        Back to FitBuddy

    </section>

  </main>
